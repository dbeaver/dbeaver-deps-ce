name: Verify

on:
  workflow_call:
    inputs:
      project-directory:
        required: true
        type: string

    outputs:
      run-id:
        value: ${{ jobs.build-and-test.outputs.run-id }}

jobs:
  build:
    name: Verify P2 build
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read

    outputs:
      run-id: ${{ github.run_id }}

    env:
      MAVEN_OPTS: -Xmx2048m

    steps:
      - uses: dbeaver/github-actions/prepare-for-a-maven-lifecycle@devel
        with:
          project-deps: ${{ inputs.project-directory }}/project.deps
          # This is a hack. The project-deps file rarely changes,
          # ensuring that the cache is reused across pretty much all runs.
          cache-dependency-path: "**/project.deps"

      - uses: dbeaver/github-actions/build-p2@dbeaver/dbeaver-devops#2023-custom-p2
